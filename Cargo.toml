[workspace]
members = [
    "src-tauri",        # Tauri application
]

resolver = "2"  # Ensures dependencies work correctly in Rust 2021

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (checked against 'cargo dist --version')
cargo-dist-version = "0.22.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi"]
# Target platforms to build apps for (one of "all", "linux", "macos", "windows")
targets = ["x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = true
# Repository URL
repository = "https://github.com/SV-stark/FileExplorer"


